plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Native shell around the live 2Pay web app. The terminal, dashboards, settings and ads are the web app, so
// they update the moment you deploy. Native code adds what a browser can't: tap-to-pay via Host Card Emulation.
def siteHost = '2-pay-technologies-mvp.vercel.app'
def startPath = '/dashboard/merchant'

// Signing: keystore.properties lives OUTSIDE the repo (default ~/.2pay-android/keystore.properties).
def keystoreProps = new Properties()
def keystoreFile = file(System.getenv('TWOPAY_KEYSTORE_PROPS') ?: "${System.getProperty('user.home')}/.2pay-android/keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.twopay.merchant'
    compileSdk 34

    defaultConfig {
        applicationId 'com.twopay.merchant'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '2.0.0'

        buildConfigField 'String', 'SITE_HOST', "\"${siteHost}\""
        buildConfigField 'String', 'START_PATH', "\"${startPath}\""
        manifestPlaceholders = [hostName: siteHost]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'

    testImplementation 'junit:junit:4.13.2'
}
