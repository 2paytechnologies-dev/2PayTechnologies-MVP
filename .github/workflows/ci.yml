name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Real route handlers against an in-memory database. It also makes one call to Arifpay's public sandbox, so an outage
  # there can fail this job; it is reported separately so it does not hide the unit tests above.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the stand-in database and the app
        run: |
          export FAYDA_PRIVATE_JWK="$(cat tests/e2e/fayda-client.jwk.json)"
          node tests/e2e/mock-postgrest.mjs &
          npx next dev -p 3170 &
          for i in $(seq 1 60); do curl -fs http://localhost:3170/api/health >/dev/null && break; sleep 2; done
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:4020
          SUPABASE_SERVICE_ROLE_KEY: service
          AUTH_ENFORCED: "true"
          SESSION_SECRET: qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq
          ADMIN_PHONES: "0711000111"
          RAIL_MODE: live
          PUBLIC_BASE_URL: http://localhost:3170
          ARIFPAY_WEBHOOK_SECRET: unit-test-webhook-secret-0123456789
          SMS_WEBHOOK_URL: http://localhost:4030
          CRON_SECRET: cron-secret-for-tests
          KYC_REQUIRED_FOR_LIVE: "true"
          # V2.4: a TEST encryption key, and the pretend national ID provider that the tests start on port 4040 (TEST key pair)
          DATA_ENCRYPTION_KEY: sUZyu4eR6emKWbHKI5O1YGPURWjcZtmsU0VHVXVHik0=
          FAYDA_ISSUER: http://localhost:4040
          FAYDA_CLIENT_ID: 2pay-e2e
          FAYDA_ALLOW_INSECURE: "true"
          # V2.5: the pretend Fayda e-KYC gateway (FAN + code) the tests start on port 4050; the Fayda gate is off here so the other tests can sell
          FAYDA_EKYC_URL: http://localhost:4050
          FAYDA_EKYC_KEY: e2e-ekyc-key
          KYC_REQUIRE_FAYDA: "false"
      - run: node --experimental-transform-types --no-warnings tests/e2e/e2e.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME) with licences accepted.
      - name: Tap protocol unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --console=plain
