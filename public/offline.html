<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020617" />
  <title>2Pay · Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #020617; color: #f1f5f9;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
    .card { max-width: 340px; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #10b981; color: #022c22; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="2Pay" />
    <h1>You're offline</h1>
    <p>2Pay needs an internet connection to take and confirm payments. Check your connection, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
